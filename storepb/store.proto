message UseRequest {
    string msg = 1;
}

message UseResponse {
    string result = 1;
}

message InsertRequest {
    string key = 1;
    string value = 2;
}

message InsertResponse {
    string result = 1;
}

message SelectRequest {
    string key = 1;
}

message SelectResponse {
    string result = 1;
}

